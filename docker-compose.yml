version: '3.8'

services:
  # Python FastAPI AI Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai_resume_screener_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  # Full-Stack Web App (React Vite UI + Node.js Express REST API)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_resume_screener_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/ai-resume-screener}
      - JWT_SECRET=${JWT_SECRET:-production_secure_jwt_secret_key_change_me}
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - ai-service
    volumes:
      - resume-uploads:/app/backend/uploads

volumes:
  resume-uploads:
